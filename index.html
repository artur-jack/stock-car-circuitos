<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traçado do circuito · Stock Car</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#202b3b;background:#fff;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1400px;margin:auto}
header{display:flex;justify-content:space-between;align-items:start;gap:20px;border-bottom:1px solid #e4e9ef;padding-bottom:12px}
.eyebrow{font-size:11px;color:#68778c;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 5px}
h1{font-size:clamp(18px,2.5vw,25px);margin:0;font-weight:600}#status{font-size:12px;color:#63738a;margin:8px 0}
#visual{min-height:240px;height:calc(100vh - 165px);display:grid;place-items:center;overflow:hidden}
#visual svg,#visual img{display:block;width:100%;height:100%;max-height:100%;object-fit:contain}
.empty{text-align:center;max-width:560px;padding:24px;color:#63738a;line-height:1.6}
.empty strong{color:#26364d;font-size:20px;display:block;margin-bottom:8px}
footer{border-top:1px solid #e4e9ef;padding-top:10px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#68778c}
a{color:#176bc2;text-decoration:none}a:hover{text-decoration:underline}
#preview{padding:10px;background:#f1f5f9;margin-bottom:16px;border-radius:6px;font-size:13px}
select{font:inherit;padding:5px;margin-left:8px;max-width:100%}[hidden]{display:none!important}
@media(max-height:400px){body{padding:10px}#visual{height:calc(100vh - 120px);min-height:100px}header{padding-bottom:6px}#status{margin:4px 0}}
</style>
</head>
<body>
<main>
<div id="preview" hidden>Prévia local — selecione uma pista:<select id="circuitPicker" aria-label="Circuito para prévia"></select></div>
<header><div><p class="eyebrow">Ficha do circuito</p><h1 id="title">Aguardando seleção no SAS</h1></div></header>
<p id="status" role="status" aria-live="polite">Selecione um circuito no relatório.</p>
<div id="visual"><div class="empty">O traçado aparecerá quando o SAS enviar uma única pista.</div></div>
<footer><span id="credit">Representação de referência; a configuração da etapa pode variar.</span><a id="source" target="_blank" rel="noopener noreferrer" hidden>Consultar ficha técnica ↗</a></footer>
</main>
<script>
'use strict';
const CIRCUITS = {"curvelo":{"nome":"Circuito dos Cristais","fonte":"https://www.chronon.com.br/autodromos/curvelo/","imagem":"","credito":""},"cascavel":{"nome":"Autódromo Internacional Zilmar Beux","fonte":"https://www.chronon.com.br/autodromos/cascavel/","imagem":"","credito":""},"interlagos":{"nome":"Autódromo José Carlos Pace - Interlagos","fonte":"https://www.chronon.com.br/autodromos/interlagos/","imagem":"","credito":""},"goiania":{"nome":"Autódromo Internacional Ayrton Senna","fonte":"https://www.chronon.com.br/autodromos/goiania/","imagem":"","credito":""},"cuiaba":{"nome":"Autódromo Internacional de Mato Grosso","fonte":"https://www.chronon.com.br/wp-content/uploads/2025/10/Autodromo-Internacional-de-Cuiaba.pdf","imagem":"","credito":""},"velocitta":{"nome":"Autódromo Velocitta","fonte":"https://www.chronon.com.br/autodromos/velo-citta/","imagem":"https://www.chronon.com.br/wp-content/uploads/2026/06/Velocitta-Crono.png","credito":"Ficha técnica: Audace Tech / Chronon. Imagem carregada do site de origem."},"santa_cruz":{"nome":"Autódromo Internacional de Santa Cruz do Sul","fonte":"https://www.chronon.com.br/autodromos/santa-cruz-do-sul/","imagem":"","credito":""},"brasilia":{"nome":"Autódromo Internacional Nelson Piquet","fonte":"https://www.chronon.com.br/wp-content/uploads/2025/11/Brasiliapista.pdf","imagem":"./brasilia.png","credito":"Traçado de referência: Audace Tech / Chronon. Imagem da ficha técnica de Brasília."},"velopark":{"nome":"Velopark","fonte":"https://www.chronon.com.br/autodromos/velopark/","imagem":"","credito":""}};
const INTERLAGOS_PATH = "M 147.7 383.9 L 175.7 492.2 L 178.7 503.6 L 181.6 510.1 L 188.3 520.1 L 191.8 522.9 L 196.7 524.9 L 201.6 525.0 L 207.0 523.9 L 209.8 522.4 L 218.6 514.3 L 227.1 504.9 L 230.4 502.4 L 234.8 500.9 L 239.2 500.6 L 245.6 502.7 L 259.2 511.0 L 270.0 515.5 L 278.0 517.5 L 285.4 518.5 L 292.1 518.8 L 301.9 517.7 L 309.5 516.0 L 318.7 512.7 L 327.4 507.7 L 336.0 500.9 L 343.0 493.6 L 348.5 485.8 L 352.5 478.5 L 355.9 470.3 L 369.3 426.3 L 374.9 404.2 L 384.5 366.8 L 396.3 318.9 L 416.9 240.5 L 424.3 212.2 L 429.6 192.4 L 432.0 183.2 L 432.9 177.3 L 432.3 171.9 L 431.0 168.2 L 428.0 163.8 L 422.7 160.1 L 416.5 157.5 L 407.5 155.6 L 380.6 150.3 L 370.1 149.1 L 363.6 149.6 L 355.7 150.7 L 348.1 152.9 L 341.5 156.9 L 335.2 160.6 L 328.8 165.8 L 322.8 172.5 L 314.5 183.1 L 287.2 219.9 L 271.1 242.6 L 257.5 262.1 L 242.5 281.7 L 234.7 292.6 L 228.6 300.8 L 224.4 305.5 L 219.7 308.4 L 213.0 310.8 L 205.6 311.8 L 194.5 311.5 L 187.1 310.3 L 181.2 308.4 L 176.0 306.0 L 167.0 301.2 L 162.5 297.2 L 159.6 293.2 L 156.7 287.6 L 154.5 279.9 L 151.8 268.5 L 149.6 258.1 L 146.6 239.0 L 146.0 231.1 L 146.1 223.1 L 148.0 217.0 L 151.1 213.9 L 153.2 212.8 L 155.9 211.9 L 159.5 211.5 L 163.4 212.5 L 167.4 214.1 L 178.3 222.3 L 182.6 224.9 L 186.0 226.4 L 189.7 227.1 L 193.0 227.4 L 196.7 226.9 L 201.8 225.0 L 207.8 220.1 L 211.1 215.1 L 212.9 209.6 L 213.2 205.0 L 212.5 199.6 L 210.4 195.3 L 205.8 188.5 L 201.5 184.2 L 186.6 169.7 L 179.0 160.8 L 173.7 153.0 L 169.8 142.5 L 166.9 129.4 L 165.5 121.5 L 164.8 114.4 L 165.3 108.6 L 167.5 104.6 L 169.4 102.2 L 172.5 101.2 L 175.0 100.6 L 178.3 101.1 L 182.1 102.7 L 200.3 123.4 L 216.0 140.8 L 218.7 143.0 L 224.6 147.1 L 230.0 149.5 L 234.5 150.8 L 240.0 151.7 L 245.1 152.3 L 250.9 152.4 L 260.2 151.0 L 267.2 148.8 L 274.7 144.5 L 282.3 138.3 L 286.5 132.7 L 291.0 126.5 L 303.1 107.4 L 316.5 85.0 L 331.6 60.6 L 332.5 57.7 L 332.8 54.3 L 331.9 51.0 L 330.1 47.4 L 326.8 44.3 L 318.8 40.1 L 307.3 35.9 L 284.0 27.1 L 279.4 25.9 L 273.6 25.0 L 261.8 26.3 L 251.5 28.0 L 229.0 32.9 L 221.5 35.4 L 206.6 41.6 L 199.3 44.8 L 181.8 54.3 L 174.9 59.0 L 168.9 64.3 L 162.9 69.9 L 158.0 75.7 L 153.6 82.4 L 149.7 91.1 L 146.5 100.3 L 141.4 119.2 L 135.9 142.9 L 132.3 165.2 L 126.0 189.0 L 122.0 206.9 L 118.5 219.4 L 117.3 228.4 L 117.1 240.6 L 117.8 255.2 L 119.4 266.0 L 122.1 278.7 L 126.8 297.0 L 140.5 354.8 L 147.7 383.9";
const titleEl=document.getElementById('title');
const statusEl=document.getElementById('status');
const visual=document.getElementById('visual');
const credit=document.getElementById('credit');
const source=document.getElementById('source');
let renderVersion=0;

function safeHttps(value){
  if(typeof value!=='string'||!value.trim()||/^\(ausentes\)$/i.test(value.trim()))return null;
  try{const url=new URL(value);return url.protocol==='https:'&&!url.username&&!url.password?url.href:null;}catch{return null;}
}
function emptyState(heading,message){
  visual.replaceChildren();const box=document.createElement('div');box.className='empty';
  const strong=document.createElement('strong');strong.textContent=heading;
  const detail=document.createElement('span');detail.textContent=message;
  box.append(strong,detail);visual.append(box);
}
function renderCircuit(id,name,imageUrl){
  const version=++renderVersion;
  const key=String(id??'').trim();const info=CIRCUITS[key];
  titleEl.textContent=String(name||info?.nome||key||'Circuito');
  source.hidden=!info?.fonte;if(info?.fonte)source.href=info.fonte;else source.removeAttribute('href');
  credit.textContent='Representação de referência; a configuração da etapa pode variar.';
  visual.replaceChildren();
  const catalogImage=info?.imagem ? new URL(info.imagem,document.baseURI).href : null;
  const image=safeHttps(imageUrl)||safeHttps(catalogImage);
  if(image){
    statusEl.textContent='Carregando traçado…';
    const img=document.createElement('img');img.alt='Traçado de '+titleEl.textContent;
    img.referrerPolicy='no-referrer';
    img.onload=()=>{if(version===renderVersion){statusEl.textContent='Traçado de referência';credit.textContent=info?.credito||'Imagem indicada pelo cadastro do relatório.';}};
    img.onerror=()=>{if(version===renderVersion){statusEl.textContent='Não foi possível carregar a imagem.';emptyState('Imagem indisponível','Consulte a ficha técnica pelo link abaixo. O endereço pode estar inacessível ou bloquear carregamento externo.');}};
    img.src=image;visual.append(img);return;
  }
  if(key==='interlagos'){
    const ns='http://www.w3.org/2000/svg';const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox','0 0 550 550');svg.setAttribute('role','img');svg.setAttribute('aria-label','Traçado de referência de Interlagos');
    const path=document.createElementNS(ns,'path');path.setAttribute('d',INTERLAGOS_PATH);
    path.setAttribute('fill','none');path.setAttribute('stroke','#397dc5');path.setAttribute('stroke-width','10');path.setAttribute('stroke-linecap','round');path.setAttribute('stroke-linejoin','round');
    svg.append(path);visual.append(svg);
    statusEl.textContent='Traçado de referência de Interlagos';
    credit.textContent='Desenho extraído do viewer HTML fornecido no projeto; não é uma medição cartográfica.';return;
  }
  statusEl.textContent='Circuito recebido do relatório.';
  emptyState('Traçado ainda não cadastrado','A integração está funcionando. Falta cadastrar a imagem desta pista. A ficha técnica está disponível no link abaixo.');
}
function handleData(message){
  if(!message||!Array.isArray(message.data))return false;
  const rows=message.data;
  if(!rows.length){++renderVersion;titleEl.textContent='Nenhum circuito';statusEl.textContent='Nenhuma linha recebida.';source.hidden=true;emptyState('Selecione um circuito','Volte ao mapa e abra a ficha de uma pista.');return true;}
  if(rows.some(row=>!Array.isArray(row)||row.length<2)){
    ++renderVersion;titleEl.textContent='Configuração de variáveis';statusEl.textContent='Dados recebidos em formato inesperado.';source.hidden=true;
    emptyState('Confira as variáveis no VA','Use nesta ordem: circuito_id, Circuito e imagem_tracado_url.');return true;
  }
  const unique=new Map();for(const row of rows)unique.set(String(row[0]??'').trim(),row);
  if(unique.size!==1){++renderVersion;titleEl.textContent='Selecione uma pista';statusEl.textContent=unique.size+' circuitos recebidos.';source.hidden=true;emptyState('A página ainda não está filtrada','Abra os detalhes pelo ponto do mapa ou configure uma ação de filtro para este objeto.');return true;}
  const row=unique.values().next().value;renderCircuit(row[0],row[1],row[2]);return true;
}
// DDC recebe mensagens do iframe pai conforme o protocolo exemplificado pela SAS.
// Nenhum dado recebido é enviado de volta, salvo ou transmitido a outros serviços.
window.addEventListener('message',event=>{
  if(window.parent===window||event.source!==window.parent)return;
  let origin;try{origin=new URL(event.origin);}catch{return;}
  if(origin.protocol!=='https:'||!(origin.hostname==='sas.com'||origin.hostname.endsWith('.sas.com')))return;
  let msg=event.data;
  if(typeof msg==='string'){try{msg=JSON.parse(msg);}catch{return;}}
  handleData(msg);
});
// Prévia fora do SAS. O seletor de demonstração não aparece dentro do relatório.
if(window.parent===window){
  document.getElementById('preview').hidden=false;
  const picker=document.getElementById('circuitPicker');
  for(const [id,info]of Object.entries(CIRCUITS)){const option=document.createElement('option');option.value=id;option.textContent=info.nome;picker.append(option);}
  picker.value='interlagos';picker.addEventListener('change',()=>renderCircuit(picker.value,CIRCUITS[picker.value].nome,''));
  renderCircuit('interlagos',CIRCUITS.interlagos.nome,'');
}
</script>
</body>
</html>
